<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    Visits for <span th:text="${pet.name}">Pet</span>
    <small class="text-muted" th:text="'(' + ${owner.firstName} + ' ' + ${owner.lastName} + ')'"></small>
  </h2>

  <dl class="dl-horizontal" style="margin-bottom: 1rem;">
    <dt>Birth Date</dt>
    <dd th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></dd>
    <dt>Type</dt>
    <dd th:text="${pet.type}"></dd>
  </dl>

  <a th:href="@{'/owners/' + ${owner.id}}" class="btn btn-default" style="margin-bottom: 1rem;">&larr; Back to Owner</a>
  <a th:href="@{'/owners/' + ${owner.id} + '/pets/' + ${pet.id} + '/visits/new'}" class="btn btn-primary" style="margin-bottom: 1rem;">Add Visit</a>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Visit Date</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="visit : ${visitsPage.content}">
        <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
        <td th:text="${visit.description}"></td>
      </tr>
      <tr th:if="${visitsPage.totalElements == 0}">
        <td colspan="2" class="text-muted">No visits recorded.</td>
      </tr>
    </tbody>
  </table>

  <div th:if="${totalVisitPages > 1}">
    <span>Pages:</span>
    <span>[</span>
    <span th:each="i: ${#numbers.sequence(1, totalVisitPages)}">
      <a th:if="${currentVisitPage != i}"
         th:href="@{'/owners/' + ${owner.id} + '/pets/' + ${pet.id} + '/visits?visitPage=' + ${i}}">[[${i}]]</a>
      <span th:unless="${currentVisitPage != i}">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a th:if="${currentVisitPage > 1}"
         th:href="@{'/owners/' + ${owner.id} + '/pets/' + ${pet.id} + '/visits?visitPage=1'}"
         th:title="#{first}" class="fa fa-fast-backward"></a>
      <span th:unless="${currentVisitPage > 1}" th:title="#{first}" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a th:if="${currentVisitPage > 1}"
         th:href="@{'/owners/' + ${owner.id} + '/pets/' + ${pet.id} + '/visits?visitPage=' + ${currentVisitPage - 1}}"
         th:title="#{previous}" class="fa fa-step-backward"></a>
      <span th:unless="${currentVisitPage > 1}" th:title="#{previous}" class="fa fa-step-backward"></span>
    </span>
    <span>
      <a th:if="${currentVisitPage < totalVisitPages}"
         th:href="@{'/owners/' + ${owner.id} + '/pets/' + ${pet.id} + '/visits?visitPage=' + ${currentVisitPage + 1}}"
         th:title="#{next}" class="fa fa-step-forward"></a>
      <span th:unless="${currentVisitPage < totalVisitPages}" th:title="#{next}" class="fa fa-step-forward"></span>
    </span>
    <span>
      <a th:if="${currentVisitPage < totalVisitPages}"
         th:href="@{'/owners/' + ${owner.id} + '/pets/' + ${pet.id} + '/visits?visitPage=' + ${totalVisitPages}}"
         th:title="#{last}" class="fa fa-fast-forward"></a>
      <span th:unless="${currentVisitPage < totalVisitPages}" th:title="#{last}" class="fa fa-fast-forward"></span>
    </span>
  </div>

</body>

</html>
