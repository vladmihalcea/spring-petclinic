# database init, supports postgres too
database=postgres
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost/petclinic?reWriteBatchedInserts=true}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASS:admin}
# disable the JIT compilation, which costs more than it saves for OLTP queries, and end the
# sessions left idle in an open transaction, as they keep their locks and block VACUUM
spring.datasource.hikari.data-source-properties.options=-c jit=off -c idle_in_transaction_session_timeout=1min
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always
